<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">How a client syncs the malicious-packages feed</title>
  <desc id="desc">The client downloads manifest.json, compares its watermark with changes_since and generated_at, then either loads every snapshot file, downloads nothing, or applies the changes file.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .decision { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .full { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .changes { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .idle { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .stop { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    .save { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #334155; }
    .edge { stroke: #334155; stroke-width: 1.5; fill: none; }
    .edgelabel { font-size: 12px; font-weight: 600; }
  </style>
  <rect width="1100" height="760" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="box" x="450" y="20" width="200" height="40" rx="8"/>
  <text class="label" x="550" y="45" text-anchor="middle">Start sync</text>

  <line class="edge" x1="550" y1="60" x2="550" y2="84" marker-end="url(#arrow)"/>

  <rect class="box" x="420" y="86" width="260" height="40" rx="8"/>
  <text class="label" x="550" y="111" text-anchor="middle">GET manifest.json</text>

  <line class="edge" x1="550" y1="126" x2="550" y2="150" marker-end="url(#arrow)"/>

  <rect class="decision" x="390" y="152" width="320" height="48" rx="8"/>
  <text class="label" x="550" y="181" text-anchor="middle">Schema major understood?</text>

  <path class="edge" d="M 390 176 H 250 V 230" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="300" y="168" text-anchor="middle" fill="#b91c1c">no</text>

  <rect class="stop" x="130" y="232" width="180" height="40" rx="8"/>
  <text class="label" x="220" y="257" text-anchor="middle">Refuse to sync</text>

  <line class="edge" x1="550" y1="200" x2="550" y2="228" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="568" y="220" fill="#047857">yes</text>

  <rect class="decision" x="390" y="230" width="320" height="48" rx="8"/>
  <text class="label" x="550" y="259" text-anchor="middle">Compare stored watermark</text>

  <!-- three branches -->
  <path class="edge" d="M 430 278 V 310 H 190 V 338" marker-end="url(#arrow)"/>
  <path class="edge" d="M 550 278 V 338" marker-end="url(#arrow)"/>
  <path class="edge" d="M 670 278 V 310 H 910 V 338" marker-end="url(#arrow)"/>

  <!-- FULL -->
  <rect class="full" x="40" y="340" width="300" height="56" rx="8"/>
  <text class="small" x="190" y="362" text-anchor="middle">No watermark, or</text>
  <text class="small" x="190" y="380" text-anchor="middle">watermark &lt; changes_since</text>

  <line class="edge" x1="190" y1="396" x2="190" y2="420" marker-end="url(#arrow)"/>

  <rect class="full" x="40" y="422" width="300" height="52" rx="8"/>
  <text class="label" x="190" y="444" text-anchor="middle">FULL</text>
  <text class="small" x="190" y="462" text-anchor="middle">Download every file in files[]</text>

  <line class="edge" x1="190" y1="474" x2="190" y2="498" marker-end="url(#arrow)"/>

  <rect class="full" x="40" y="500" width="300" height="52" rx="8"/>
  <text class="small" x="190" y="522" text-anchor="middle">Stage, upsert,</text>
  <text class="small" x="190" y="540" text-anchor="middle">delete rows missing from staging</text>

  <!-- NOTHING -->
  <rect class="idle" x="400" y="340" width="300" height="56" rx="8"/>
  <text class="small" x="550" y="372" text-anchor="middle">watermark == generated_at</text>

  <line class="edge" x1="550" y1="396" x2="550" y2="420" marker-end="url(#arrow)"/>

  <rect class="idle" x="400" y="422" width="300" height="52" rx="8"/>
  <text class="label" x="550" y="453" text-anchor="middle">Download nothing else</text>

  <line class="edge" x1="550" y1="474" x2="550" y2="598" marker-end="url(#arrow)"/>

  <!-- CHANGES -->
  <rect class="changes" x="760" y="340" width="300" height="56" rx="8"/>
  <text class="small" x="910" y="362" text-anchor="middle">changes_since &lt;= watermark</text>
  <text class="small" x="910" y="380" text-anchor="middle">and watermark &lt; generated_at</text>

  <line class="edge" x1="910" y1="396" x2="910" y2="420" marker-end="url(#arrow)"/>

  <rect class="changes" x="760" y="422" width="300" height="52" rx="8"/>
  <text class="label" x="910" y="444" text-anchor="middle">CHANGES</text>
  <text class="small" x="910" y="462" text-anchor="middle">Download each eco.changes.jsonl</text>

  <line class="edge" x1="910" y1="474" x2="910" y2="498" marker-end="url(#arrow)"/>

  <rect class="changes" x="760" y="500" width="300" height="52" rx="8"/>
  <text class="small" x="910" y="522" text-anchor="middle">Read newest first. Stop when</text>
  <text class="small" x="910" y="540" text-anchor="middle">modified is not newer than watermark</text>

  <!-- converge -->
  <path class="edge" d="M 190 552 V 622 H 368" marker-end="url(#arrow)"/>
  <path class="edge" d="M 910 552 V 622 H 732" marker-end="url(#arrow)"/>

  <rect class="save" x="370" y="600" width="360" height="44" rx="8"/>
  <text class="label" x="550" y="627" text-anchor="middle">Save watermark = generated_at</text>

  <line class="edge" x1="550" y1="644" x2="550" y2="678" marker-end="url(#arrow)"/>

  <rect class="box" x="480" y="680" width="140" height="40" rx="8"/>
  <text class="label" x="550" y="705" text-anchor="middle">Done</text>
</svg>
